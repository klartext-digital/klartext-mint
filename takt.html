<div>
  <span>Bilder je Sekunde</span>
  <b id="z">–</b>
  <p>Diese Seite enthaelt nichts ausser diesem Zaehler.
     Kein Bild, kein Video, kein Scrollskript, kein Stylesheet von aussen.</p>
  <p id="h"></p>
</div>
<script>
/* Reiner Vergleichswert: was schafft dieser Browser auf einer voellig
   leeren Seite? Ist die Zahl hier ebenfalls 30, liegt es nicht an
   unserer Seite, sondern am Browser oder am Geraet. */
var n=0,t0=performance.now(),z=document.getElementById('z');
(function takt(t){
  n++;
  if(t-t0>=1000){z.textContent=Math.round(n*1000/(t-t0));n=0;t0=t}
  requestAnimationFrame(takt);
})(t0);
document.getElementById('h').textContent =
  'Bildschirm: ' + screen.width + ' x ' + screen.height +
  ' \u00b7 Pixelverhaeltnis ' + (window.devicePixelRatio||1);
</script>
